# CI for this external F´ project.
#
# Runs on its own pushes/PRs (using the fprime submodule as committed) and on `workflow_dispatch`
# from the nasa/fprime external-CI orchestrator, which overlays an exact F´ commit under lib/fprime
# and reports the result back as a Check Run on that commit. Dispatched runs build untrusted F´ PR
# code: they get no secrets, `contents: read` only, and ccache is disabled so nothing is written to
# this repository's default-branch cache.
name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id != '' && format('ext-ci {0} ({1}@{2})', inputs.dispatch_id, inputs.fprime_repository, inputs.fprime_ref) || '' }}

on:
  push:
    branches: [ devel ]
  pull_request:
  workflow_dispatch:
    inputs:
      fprime_repository:
        description: "F´ repository to overlay under lib/fprime (<owner>/<repo>); a fork for fork PRs"
        type: string
        default: nasa/fprime
      fprime_ref:
        description: "F´ ref to overlay; the orchestrator passes an exact commit SHA"
        type: string
        default: devel
      fprime_pr_number:
        description: "nasa/fprime PR number being tested (empty for branch runs); used to pick nasa/fprime-gds@pr-<N>"
        type: string
        default: ""
      dispatch_id:
        description: "Correlation id set by the orchestrator (informational)"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.dispatch_id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  hub-communication:
    name: "Generic Hub round-trip"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup output-cleaner"
        uses: nasa/fprime-actions/output-cleaner@devel
      - name: "Checkout project"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Overlay requested F´ revision"
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.fprime_repository }}
          ref: ${{ inputs.fprime_ref }}
          path: lib/fprime
          submodules: true
          fetch-depth: 0
          filter: blob:none
      - name: "Setup F´ toolchain"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: lib/fprime
          ccache: ${{ github.event_name != 'workflow_dispatch' }}
      - name: "Upgrade fprime-gds to pr-<N> (if the F´ PR has a matching GDS branch)"
        if: github.event_name == 'workflow_dispatch' && inputs.fprime_pr_number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.fprime_pr_number }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || { echo "::error::fprime_pr_number must be numeric"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.github.com/repos/nasa/fprime-gds/branches/pr-${PR_NUMBER}")
          if [ "${code}" = "200" ]; then
            echo "Installing nasa/fprime-gds@pr-${PR_NUMBER}"
            pip install --upgrade "git+https://github.com/nasa/fprime-gds.git@pr-${PR_NUMBER}"
          else
            echo "No nasa/fprime-gds pr-${PR_NUMBER} branch (HTTP ${code}); keeping the pinned version"
          fi
      - name: "Generate"
        run: fprime-util generate 2>&1 | output-cleaner
        shell: bash
      - name: "Build"
        run: fprime-util build -j8 2>&1 | output-cleaner
        shell: bash
      - name: "Set up runtime config variables"
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILD_DIR="${GITHUB_WORKSPACE}/build-artifacts/Linux"
          A_DIR="${BUILD_DIR}/FprimeGenericHubReference_Deployments_DeploymentA"
          B_BIN="${BUILD_DIR}/FprimeGenericHubReference_Deployments_DeploymentB/bin/FprimeGenericHubReference_Deployments_DeploymentB"
          A_DICT="${A_DIR}/dict/DeploymentATopologyDictionary.json"
          A_TEST_DIR="${GITHUB_WORKSPACE}/FprimeGenericHubReference/Deployments/DeploymentA/test/int"
          A_TEST_CONFIG="${A_TEST_DIR}/int_config.json"
          LOG_DIR="${GITHUB_WORKSPACE}/hub-communication-logs"
          B_LOG="${LOG_DIR}/deploymentB.stdout.log"
          GDS_LOG="${LOG_DIR}/gds.stdout.log"
          GDS_LOG_DIR="${LOG_DIR}/gds"
          PORT_A=50000
          PORT_B=50001

          # Resolve the HubCommandTest opcode from the dictionary instead of hardcoding it.
          # F´ renders opcodes in the console as lowercase, unpadded hex, e.g. 0x11017500.
          CMD_OPCODE="$(jq -r '.commands[] | select(.name | endswith(".HubCommandTest")) | .opcode' "${A_DICT}")"
          if [[ -z "${CMD_OPCODE}" || "${CMD_OPCODE}" == "null" ]]; then
            echo "Could not resolve HubCommandTest opcode from ${A_DICT}" >&2
            exit 1
          fi
          # Convert the dictionary's decimal opcode to the console's lowercase hexadecimal format.
          CMD_OPCODE_HEX="$(printf '0x%x' "${CMD_OPCODE}")"
          echo "HubCommandTest opcode: ${CMD_OPCODE_HEX}"

          {
            echo "A_DIR=${A_DIR}"
            echo "B_BIN=${B_BIN}"
            echo "A_DICT=${A_DICT}"
            echo "A_TEST_DIR=${A_TEST_DIR}"
            echo "A_TEST_CONFIG=${A_TEST_CONFIG}"
            echo "LOG_DIR=${LOG_DIR}"
            echo "B_LOG=${B_LOG}"
            echo "GDS_LOG=${GDS_LOG}"
            echo "GDS_LOG_DIR=${GDS_LOG_DIR}"
            echo "PORT_A=${PORT_A}"
            echo "PORT_B=${PORT_B}"
            echo "CMD_OPCODE=${CMD_OPCODE}"
            echo "CMD_OPCODE_HEX=${CMD_OPCODE_HEX}"
          } >> "${GITHUB_ENV}"

      - name: "Run Generic Hub round-trip"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "${LOG_DIR}"

          echo "Starting DeploymentB on TCP port ${PORT_B}"
          # stdbuf line-buffers B's output so its logs are ensured to be on disk when we grep below
          stdbuf -oL -eL "${B_BIN}" -a 127.0.0.1 -p "${PORT_B}" >"${B_LOG}" 2>&1 &

          echo "Starting DeploymentA through GDS on TCP port ${PORT_A}"
          mkdir -p "${GDS_LOG_DIR}"
          fprime-gds \
            --ip-client \
            --ip-address 127.0.0.1 \
            --ip-port "${PORT_A}" \
            -d "${A_DIR}" \
            --dictionary "${A_DICT}" \
            -g none \
            --logs "${GDS_LOG_DIR}" \
            --log-to-stdout \
            >"${GDS_LOG}" 2>&1 &

          # Wait for GDS to connect DeploymentA before pytest
          a_timeout=$((SECONDS + 60))
          until grep -q "tcp_handler: Client connected" "${GDS_LOG}"; do
            (( SECONDS < a_timeout )) || {
              echo "DeploymentA/GDS did not establish its TCP connection before timeout" >&2
              exit 1
            }
            sleep 1
          done

          # Exercise message paths and verify return events through pytest.
          pytest "${A_TEST_DIR}" \
            --dictionary "${A_DICT}" \
            --deployment-config "${A_TEST_CONFIG}" \
            --logs "${GDS_LOG_DIR}"

      - name: "Verify HubCommandTest on DeploymentB"
        shell: bash
        run: |
          # Verify in DeploymentB's logs that the commands have been dispatched
          # this is a current limitation - FprimeRouter::cmdResponseIn_handler
          # is a no-op that discards the hub-returned command response

          set -Eeuo pipefail
          sleep 1

          if ! grep -q "OpCodeDispatched : Opcode ${CMD_OPCODE_HEX} dispatched" "${B_LOG}"; then
            echo "DeploymentB did not dispatch HubCommandTest opcode ${CMD_OPCODE_HEX}" >&2
            exit 1
          fi
          if ! grep -q "HubCommandTestEvr" "${B_LOG}"; then
            echo "DeploymentB did not log HubCommandTestEvr" >&2
            exit 1
          fi
          if ! grep -q "OpCodeCompleted : Opcode ${CMD_OPCODE_HEX} completed" "${B_LOG}"; then
            echo "DeploymentB did not complete HubCommandTest opcode ${CMD_OPCODE_HEX}" >&2
            exit 1
          fi

          echo "Generic Hub round-trip assertions passed"

      - name: "Archive Generic Hub logs"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-hub-reference-logs
          path: |
            hub-communication-logs
            !hub-communication-logs/gds/**/TestLog_*.xlsx
          if-no-files-found: warn
          retention-days: 5
